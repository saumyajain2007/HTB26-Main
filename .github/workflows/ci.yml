# Continuous integration for HTB26.
#
# Runs on pull requests and on pushes to main. It needs no secrets, never calls a
# paid or sponsor service (the jury, Gemini, Vultr and Cortex are all faked in tests),
# and the default token is read-only.
#
# What each job covers:
#   python  Python 3.11 and 3.12: core, API, worker and deploy tests. Database tests run
#           against a throwaway Postgres 16 (the version the docs target).
#   lean    The Lean 4 certificate layer. In the python job these tests skip because Lean
#           is not installed, so this job builds the Lean project and fails on any skip.
#   web     Lint, formatting, types, unit tests, generated API types, production build.
#   e2e     Playwright against the real API in fixture mode and the built app.
#   ci      One required check that is green only if all of the above are.
#
# Third-party actions are pinned to commit SHAs. To update one, resolve the new tag with
# `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha` and change the comment too.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.19"
  NODE_VERSION: "22"

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          # Disposable server inside the job; nothing here is a real credential.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --locked fails if uv.lock is out of date with the pyprojects.
      - name: Install
        run: uv sync --locked
      - name: Core and shared tests
        run: uv run pytest -q -p no:cacheprovider
      - name: API tests
        if: ${{ !cancelled() }}
        run: uv run pytest app/api/tests -q -p no:cacheprovider
      - name: Worker tests
        if: ${{ !cancelled() }}
        run: uv run pytest app/worker/tests -q -p no:cacheprovider
      - name: Deploy and migration tests
        if: ${{ !cancelled() }}
        run: uv run pytest deploy -q -p no:cacheprovider

  lean:
    name: lean certificates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache verified Lean toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/htb-lean
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/verify/lean/lean-toolchain', 'deploy/ci/lean-release.json') }}
      # The browser/Elan download route can return 504. Use the official release
      # asset API and verify its published digest without changing the pinned version.
      - name: Install pinned Lean
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          python3 deploy/ci/install_lean.py
      - name: Build Lean proofs
        working-directory: core/verify/lean
        run: lake build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --locked
      # The Lean tests skip when Lean is missing. A skip here would hide a broken
      # toolchain, so any skip fails the job.
      - name: Verify tests, with Lean
        run: |
          set -o pipefail
          uv run pytest core/verify -q -rs -p no:cacheprovider | tee pytest.log
          if grep -q SKIPPED pytest.log; then
            echo "::error::A Lean test was skipped, so Lean was not actually exercised"
            exit 1
          fi

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npm run format:check
      - name: Types
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test
      # Regenerates src/api/schema.d.ts from api/openapi.json and fails on any difference.
      - name: Generated API types are current
        if: ${{ !cancelled() }}
        run: npm run check:api
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install API
        run: uv sync --locked
      - name: Install web
        working-directory: app/web
        run: npm ci
      - name: Install Chromium
        working-directory: app/web
        run: npx playwright install --with-deps chromium
      # Playwright starts the API (fixture mode) and the built app itself.
      - name: Playwright
        working-directory: app/web
        run: npm run e2e
      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            app/web/playwright-report
            app/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The one check to require in branch protection. A skipped or cancelled dependency
  # counts as a failure, so it cannot be bypassed by cancelling a job.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [python, lean, web, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          PYTHON: ${{ needs.python.result }}
          LEAN: ${{ needs.lean.result }}
          WEB: ${{ needs.web.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "python=$PYTHON lean=$LEAN web=$WEB e2e=$E2E"
          test "$PYTHON" = success
          test "$LEAN" = success
          test "$WEB" = success
          test "$E2E" = success
