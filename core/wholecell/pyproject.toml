# Whole-cell growth-inhibition data, scaffold splits and leakage checks (#83, #84).
# RDKit only; the model itself (#85) lives behind an optional extra so CI stays light.
[project]
name = "htb-wholecell"
version = "0.1.0"
description = "Whole-cell antibacterial dataset, splits and leakage assertions for HTB26"
requires-python = ">=3.11"
dependencies = ["rdkit==2026.9.1"]

[project.optional-dependencies]
model = [
    "chemprop>=2.1,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["htb_wholecell"]
