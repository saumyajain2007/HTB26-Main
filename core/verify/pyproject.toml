# Candidate smoke test (RDKit rules) and the optional Lean 4 certificate layer.
[project]
name = "htb-verify"
version = "0.1.0"
description = "Smoke test and Lean 4 constraint certificates for candidate molecules"
requires-python = ">=3.11"
dependencies = ["rdkit==2026.9.1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["htb_verify"]
